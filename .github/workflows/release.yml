name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish without uploading"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    services:
      slock:
        image: sujin190/slock
        ports:
          - 5658:5658
        options: >-
          --health-cmd "slock-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      SLOCK_TEST_HOST: 127.0.0.1
      SLOCK_TEST_PORT: 5658

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features --locked

      - name: Package
        run: cargo package --locked

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --locked --dry-run

      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
